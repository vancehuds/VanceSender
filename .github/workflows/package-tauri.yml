name: Package Tauri Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "pages/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CNAME"
      - "LICENSE"
      - "README.md"
      - "public-config.yaml"

permissions:
  contents: write

jobs:
  package-tauri-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── Python sidecar build ─────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --disable-pip-version-check
          pip install pyinstaller --disable-pip-version-check

      - name: Build sidecar executable
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm vancesender-sidecar.spec

      - name: Copy sidecar to Tauri bundle location
        shell: powershell
        run: |
          $triple = "x86_64-pc-windows-msvc"
          $sidecarDir = "src-tauri/sidecar"
          if (!(Test-Path $sidecarDir)) { New-Item -ItemType Directory -Path $sidecarDir -Force }
          # Copy the single-file executable with target triple suffix
          Copy-Item -Path "dist/vancesender-server.exe" -Destination "$sidecarDir/vancesender-server-$triple.exe" -Force

      - name: Smoke test sidecar
        shell: powershell
        run: |
          chcp 65001 > $null
          $triple = "x86_64-pc-windows-msvc"
          & "src-tauri/sidecar/vancesender-server-$triple.exe" --help

      # ── Tauri build ──────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri

      # ── Upload artifacts ─────────────────────────────────────────
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: VanceSender-tauri-windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MSI installer
        uses: actions/upload-artifact@v6
        with:
          name: VanceSender-tauri-windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      # ── GitHub Release ───────────────────────────────────────────
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
